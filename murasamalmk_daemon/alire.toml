name = "murasamalmk_daemon"
description = "Ada/SPARK macOS memory-pressure and thrashing-mitigation daemon"
version = "0.1.0-dev"

authors = ["Albert Starfield"]
maintainers = ["Albert Starfield <albertstarfield2001@gmail.com>"]
licenses = "MIT OR Apache-2.0 WITH LLVM-exception"
website = ""
tags = []

executables = ["murasamalmk_daemon"]

[[depends-on]]
gnatprove = "^15.1.0"

# gprbuild cannot compile Objective-C (.m has no language mapping), yet the
# gpr's Linker package needs obj/<profile>/macos_utils.o. This pre-build hook
# compiles it with clang before every gprbuild, so clean checkouts link too.
[[actions]]
type = "pre-build"
command = ["sh", "scripts/build_macos_utils.sh"]
